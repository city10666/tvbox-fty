name: TVBox Parses Evolution V5 Final

permissions:
  contents: write

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  evolve:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Fetch upstream
        run: |
          curl -L -o upstream.json \
          https://raw.githubusercontent.com/qist/tvbox/master/dianshi.json

      - name: Init state
        run: |
          mkdir -p platform
          [ -f parses_stats.json ] || echo '{}' > parses_stats.json
          [ -f aiyouteng.last.json ] || echo '{}' > aiyouteng.last.json

      # ===============================
      # 1. Normalize base (array/object safe)
      # ===============================
      - name: Normalize base
        run: |
          jq 'if type=="array" then {parses: ., spider:"https://raw.githubusercontent.com/qist/tvbox/master/jar/fan.txt;md5;3962e9dbce2c7b61a53b1b796f098d47"} else
              .parses = (
                .parses
                | map(
                    if .name=="Json聚合" and .type==3 and .url=="Demo" then
                      [
                        {"name":"并发·主力","type":2,"url":"Parallel"},
                        {"name":"轮询·兜底","type":2,"url":"Sequence"},
                        {"name":"聚合·保底","type":3,"url":"Demo"}
                      ]
                    else .
                    end
                  )
                | flatten
              )
              | .spider = "https://raw.githubusercontent.com/qist/tvbox/master/jar/fan.txt;md5;3962e9dbce2c7b61a53b1b796f098d47"
            end' upstream.json > base.json

      # ===============================
      # 2. Learning + cooldown
      # ===============================
      - name: Learn parses with cooldown
        run: |
          jq -c '.parses[]' base.json | while read -r item; do
            url=$(echo "$item" | jq -r '.url')
            [[ "$url" =~ Parallel|Sequence|Demo ]] && continue

            key=$(echo -n "$url" | md5sum | cut -d' ' -f1)
            state=$(jq -r ".\"$key\".cooldown // 0" parses_stats.json)
            fail=$(jq -r ".\"$key\".fail // 0" parses_stats.json)

            # 冷却中跳过
            if [[ $state -gt 0 ]]; then
              jq ".\"$key\".cooldown = ($state - 1)" parses_stats.json > tmp && mv tmp parses_stats.json
              continue
            fi

            # 测试访问
            if curl -k -L -A "Mozilla/5.0" --range 0-0 --connect-timeout 4 --max-time 6 -s "$url" >/dev/null; then
              hit=1
            else
              hit=0
            fi

            # 更新失败次数
            if [[ $hit -eq 0 ]]; then
              fail=$((fail+1))
            else
              fail=0
            fi

            cooldown=0
            [[ $fail -ge 3 ]] && cooldown=3

            jq ".\"$key\".fail = $fail | .\"$key\".cooldown = $cooldown" parses_stats.json > tmp && mv tmp parses_stats.json
          done

      # ===============================
      # 3. Generate platform JSONs
      # ===============================
      - name: Generate platform JSONs
        run: |
          for p in iqiyi qq youku mgtv other; do
            cat base.json | jq --arg p "$p" '
              . as $base |
              $base
              | .parses = (
                  [
                    {"name":"并发·主力","type":2,"url":"Parallel"},
                    {"name":"轮询·兜底","type":2,"url":"Sequence"},
                    {"name":"聚合·保底","type":3,"url":"Demo"}
                  ]
                  +
                  (
                    $base.parses
                    | map(select(.url!="Parallel" and .url!="Sequence" and .url!="Demo"))
                    | map(
                        if $p=="iqiyi" then select(.url|test("iqiyi"))
                        elif $p=="qq" then select(.url|test("qq|weiyun"))
                        elif $p=="youku" then select(.url|test("youku"))
                        elif $p=="mgtv" then select(.url|test("mgtv"))
                        else .
                        end
                      )
                  )
                )
            ' > platform/$p.new.json

            count=$(jq '.parses | length' platform/$p.new.json)
            if [[ $count -ge 5 ]]; then
              mv platform/$p.new.json platform/$p.json
            else
              echo "⚠️ $p parses too small, skipped"
              rm -f platform/$p.new.json
            fi
          done

      # ===============================
      # 4. Build main JSON
      # ===============================
      - name: Build main aiyouteng.json
        run: |
          cp base.json aiyouteng.json

      # ===============================
      # 5. Commit changes
      # ===============================
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add aiyouteng.json platform/*.json parses_stats.json aiyouteng.last.json
          git diff --cached --quiet || git commit -m "V5 Final platform split JSON"
          git push
