name: TVBox 精确同步

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  sync-dianshi:
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: 设置 Git 配置
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

    - name: 下载源文件
      run: |
        curl -s -o source.json "https://raw.githubusercontent.com/qist/tvbox/master/dianshi.json"

    - name: 安全处理 JSON
      run: |
        cat > process_json.py << 'EOF'
        import json
        import os
        
        # 读取源文件
        with open('source.json', 'r', encoding='utf-8') as f:
            source = json.load(f)
        
        # 定义必须优先的 sites 键值
        priority_keys = [
            "drpy_js_360影视",
            "drpy_js_百忙无果", 
            "drpy_js_腾云驾雾",
            "drpy_js_奇珍异兽",
            "drpy_js_菜狗",
            "drpy_js_优酷"
        ]
        
        def convert_path(path_value):
            """安全地转换路径"""
            if not isinstance(path_value, str):
                return path_value
            
            if path_value.startswith('./lib/'):
                return f'https://github.com/qist/tvbox/blob/master/lib/{os.path.basename(path_value)}'
            elif path_value.startswith('./js/'):
                return f'https://github.com/qist/tvbox/blob/master/js/{os.path.basename(path_value)}'
            elif path_value.startswith('./'):
                return f'https://github.com/qist/tvbox/blob/master/{path_value[2:]}'
            return path_value
        
        # 处理 sites
        priority_sites = []
        other_sites = []
        
        for site in source.get('sites', []):
            if site.get('key') in priority_keys:
                # 处理优先级 sites
                processed = site.copy()
                if 'api' in processed:
                    processed['api'] = convert_path(processed['api'])
                if 'ext' in processed and isinstance(processed['ext'], str):
                    processed['ext'] = convert_path(processed['ext'])
                priority_sites.append(processed)
            else:
                # 其他 sites
                processed = site.copy()
                if 'api' in processed:
                    processed['api'] = convert_path(processed['api'])
                if 'ext' in processed and isinstance(processed['ext'], str):
                    processed['ext'] = convert_path(processed['ext'])
                other_sites.append(processed)
        
        # 组合结果
        result = source.copy()
        result['sites'] = priority_sites + other_sites
        
        # 写入文件
        with open('dianshi.json', 'w', encoding='utf-8') as f:
            json.dump(result, f, ensure_ascii=False, indent=2)
        
        print("✅ JSON 处理完成")
        EOF
        
        python3 process_json.py

    - name: 提交更改
      run: |
        git add dianshi.json
        if ! git diff --staged --quiet; then
          git commit -m "🔄 同步 dianshi.json - $(date +'%Y-%m-%d %H:%M')"
          git push
        fi
