name: Sync Parses + Spider + Health Check

permissions:
  contents: write

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Fetch upstream dianshi.json
        run: |
          curl -L -o upstream.json \
          https://raw.githubusercontent.com/qist/tvbox/master/dianshi.json

      - name: Build parses + spider (with health check)
        run: |
          jq --slurpfile up upstream.json '
            .parses = (
              $up[0].parses
              | map(
                  if .name == "Json聚合" and .type == 3 and .url == "Demo" then
                    [
                      {"name":"解析聚合","type":3,"url":"Demo"},
                      {"name":"Json并发","type":2,"url":"Parallel"},
                      {"name":"Json轮询","type":2,"url":"Sequence"}
                    ]
                  else
                    .
                  end
                )
              | flatten
            )
            | .spider = "https://raw.githubusercontent.com/qist/tvbox/master/jar/fan.txt;md5;3962e9dbce2c7b61a53b1b796f098d47"
          ' aiyouteng.json > aiyouteng.tmp.json

          jq -c '.parses[]' aiyouteng.tmp.json | while read -r item; do
            url=$(echo "$item" | jq -r '.url')

            if [[ "$url" == "Demo" || "$url" == "Parallel" || "$url" == "Sequence" ]]; then
              echo "$item"
              continue
            fi

            if curl -I --connect-timeout 3 --max-time 5 -s "$url" | head -n 1 | grep -qE "200|301|302"; then
              echo "$item"
            else
              echo "❌ 剔除不可用解析：$url" >&2
            fi
          done | jq -s '.' > parses.ok.json

          jq --slurpfile parses parses.ok.json '
            .parses = $parses[0]
          ' aiyouteng.tmp.json > aiyouteng.json

          rm -f aiyouteng.tmp.json parses.ok.json

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add aiyouteng.json
          git diff --cached --quiet || git commit -m "sync parses + spider (health check)"
          git push
