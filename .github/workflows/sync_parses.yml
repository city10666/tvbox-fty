name: 🔄 TVBox 配置同步更新

on:
  schedule:
    - cron: '0 8 * * *'  # 每天北京时间16:00运行
  workflow_dispatch:     # 允许手动触发
  push:
    branches: [ main ]

jobs:
  sync-config:
    runs-on: ubuntu-latest
    
    steps:
    - name: 🚀 检出代码
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: ⚙️ 设置 Git 配置
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

    - name: 📥 下载源配置文件
      run: |
        # 下载 qist/tvbox 的 dianshi.json
        curl -s -o source.json "https://raw.githubusercontent.com/qist/tvbox/master/dianshi.json"
        echo "✅ 源配置文件下载完成"

    - name: 🔄 智能同步处理
      run: |
        cat > sync_script.py << 'EOF'
        import json
        import os
        
        print("📖 开始同步处理...")
        
        # 读取源配置文件
        with open('source.json', 'r', encoding='utf-8') as f:
            source_data = json.load(f)
        
        # 读取当前配置文件（如果存在）
        current_file = 'dianshi.json'
        if os.path.exists(current_file):
            with open(current_file, 'r', encoding='utf-8') as f:
                current_data = json.load(f)
            print("✅ 当前配置文件已加载")
        else:
            current_data = {}
            print("⚠️  当前配置文件不存在，将创建新文件")
        
        # 关键：将所有相对路径转换为 GitHub RAW 绝对路径
        def convert_paths(data):
            if isinstance(data, dict):
                for key, value in data.items():
                    if isinstance(value, str):
                        # 转换 ./ 开头的相对路径
                        if value.startswith('./'):
                            new_value = value.replace('./', 'https://raw.githubusercontent.com/qist/tvbox/master/')
                            data[key] = new_value
                            print(f"🔄 转换路径: {value} -> {new_value}")
                    elif isinstance(value, dict):
                        convert_paths(value)
                    elif isinstance(value, list):
                        for item in value:
                            convert_paths(item)
            elif isinstance(data, list):
                for item in data:
                    convert_paths(item)
        
        # 转换源数据中的所有路径
        print("🔧 转换相对路径为绝对路径...")
        convert_paths(source_data)
        
        # 构建最终配置（优先使用源数据，保留当前文件的自定义设置）
        final_config = source_data  # 使用转换后的源数据
        
        # 如果当前文件有自定义配置，可以在这里合并
        # 例如保留当前文件的特定站点或设置
        
        # 写入最终配置文件
        with open(current_file, 'w', encoding='utf-8') as f:
            json.dump(final_config, f, ensure_ascii=False, indent=2, separators=(',', ': '))
        
        print("✅ 配置文件同步完成")
        
        # 显示同步统计
        sites_count = len(final_config.get('sites', []))
        parses_count = len(final_config.get('parses', []))
        print(f"📊 同步统计: {sites_count} 个站点, {parses_count} 个解析接口")
        EOF
        
        python3 sync_script.py

    - name: 📊 验证配置文件
      run: |
        if [ -f dianshi.json ]; then
          echo "✅ 配置文件生成成功"
          echo "文件大小: $(wc -c < dianshi.json) 字节"
          echo "站点数量: $(grep -o '"key"' dianshi.json | wc -l) 个"
        else
          echo "❌ 配置文件生成失败"
          exit 1
        fi

    - name: 📤 提交更改
      run: |
        git add dianshi.json
        if ! git diff --staged --quiet; then
          git commit -m "🔄 自动同步TVBox配置 - $(date +'%Y-%m-%d %H:%M')"
          git push
          echo "✅ 更改已提交到仓库"
        else
          echo "📝 无新变化，无需提交"
        fi

    - name: 🔔 通知结果
      run: |
        echo "🎉 TVBox配置同步完成！"
        echo "📅 下次自动同步: 明天 16:00"
        echo "🔗 配置文件地址: https://raw.githubusercontent.com/${{ github.repository }}/main/dianshi.json"
