name: TVBox 严格格式同步

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  sync-dianshi:
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: 设置 Git 配置
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

    - name: 下载源文件
      run: |
        curl -s -o source.json "https://raw.githubusercontent.com/qist/tvbox/master/dianshi.json"
        cp dianshi.json local.json || echo "无本地文件"

    - name: 严格处理 JSON
      run: |
        cat > process_json.js << 'EOF'
        const fs = require('fs');
        const path = require('path');
        
        // 读取源文件
        const source = JSON.parse(fs.readFileSync('source.json', 'utf8'));
        
        // 定义必须优先的 sites 键值
        const priorityKeys = [
          "drpy_js_360影视",
          "drpy_js_百忙无果",
          "drpy_js_腾云驾雾",
          "drpy_js_奇珍异兽",
          "drpy_js_菜狗",
          "drpy_js_优酷"
        ];

        // 1. 处理 sites 数组
        const newSites = [];
        
        // 1.1 先添加优先级 sites
        priorityKeys.forEach(key => {
          const item = source.sites.find(x => x.key === key);
          if (item) newSites.push(processItem(item));
        });

        // 1.2 添加其他 sites
        source.sites.forEach(item => {
          if (!priorityKeys.includes(item.key)) {
            newSites.push(processItem(item));
          }
        });

        // 2. 处理单个项目
        function processItem(item) {
          // 创建副本避免修改原对象
          const newItem = JSON.parse(JSON.stringify(item));
          
          // 处理 api 路径
          if (newItem.api && newItem.api.startsWith('./')) {
            newItem.api = convertPath(newItem.api);
          }
          
          // 处理 ext 路径
          if (newItem.ext && newItem.ext.startsWith('./')) {
            newItem.ext = convertPath(newItem.ext);
          }
          
          return newItem;
        }

        // 3. 精确路径转换
        function convertPath(originalPath) {
          const baseUrl = 'https://github.com/qist/tvbox/blob/master';
          const relativePath = originalPath.replace('./', '');
          
          // 特殊处理 lib/ 和 js/ 目录
          if (originalPath.startsWith('./lib/')) {
            return `${baseUrl}/lib/${path.basename(relativePath)}`;
          }
          if (originalPath.startsWith('./js/')) {
            return `${baseUrl}/js/${path.basename(relativePath)}`;
          }
          
          // 默认处理
          return `${baseUrl}/${relativePath}`;
        }

        // 4. 构建最终结果（完全保持源结构）
        const result = {
          ...source,
          sites: newSites
        };

        // 保持 TVBox 标准格式（2空格缩进）
        fs.writeFileSync('dianshi.json', JSON.stringify(result, null, 2));
        EOF
        
        node process_json.js

    - name: 提交更改
      run: |
        git add dianshi.json
        if ! git diff --staged --quiet; then
          git commit -m "🔄 TVBox 严格格式同步 - $(date +'%Y-%m-%d')"
          git push
        fi
