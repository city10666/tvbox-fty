name: Complete Update dianshi.json from upstream

on:
  schedule:
    # 每天 UTC 时间 0 点运行（北京时间 8 点）
    - cron: '0 0 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 需要写入仓库内容
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download dianshi.json from source
        run: |
          echo "正在从源仓库下载 dianshi.json..."
          curl -L -o source_dianshi.json https://raw.githubusercontent.com/qist/tvbox/master/dianshi.json
          echo "下载完成，文件大小: $(wc -c < source_dianshi.json) 字节"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Convert and reorder dianshi.json
        run: |
          cat > convert_and_reorder.py << 'EOF'
          #!/usr/bin/env python3
          """
          完整转换和重新排序 dianshi.json：
          1. 转换相对路径为完整URL
          2. 重新排序6个关键站点到最前面
          3. 保持完整的dianshi.json结构
          """
          import json
          import sys
          from urllib.parse import urljoin

          BASE_RAW_URL = "https://raw.githubusercontent.com/qist/tvbox/master/"

          def is_url(s: str) -> bool:
              return s.startswith(('http://', 'https://', 'ftp://', '//'))

          def convert_path(path: str) -> str:
              if is_url(path):
                  return path
              if path.startswith('./'):
                  path = path[2:]
              if ';' in path:
                  parts = path.split(';')
                  converted = urljoin(BASE_RAW_URL, parts[0])
                  return ';'.join([converted] + parts[1:])
              else:
                  return urljoin(BASE_RAW_URL, path)

          def transform_json(obj, parent_key=None):
              if isinstance(obj, dict):
                  for key, val in obj.items():
                      # 跳过 ua 和 User-Agent 字段
                      if key in ['ua', 'User-Agent']:
                          continue
                      obj[key] = transform_json(val, key)
                  return obj
              elif isinstance(obj, list):
                  return [transform_json(item, parent_key) for item in obj]
              elif isinstance(obj, str):
                  # 只转换以 './' 开头的字符串
                  if obj.startswith('./'):
                      return convert_path(obj)
                  return obj
              else:
                  return obj

          def reorder_sites(data):
              """重新排序 sites 数组"""
              if 'sites' not in data:
                  return data
              sites = data['sites']
              if not isinstance(sites, list):
                  return data
              
              # 定义所需的顺序（用户指定的6个站点）
              order_keys = [
                  "drpy_js_优酷",
                  "drpy_js_腾云驾雾",
                  "drpy_js_百忙无果",
                  "drpy_js_菜狗",
                  "drpy_js_360影视",
                  "drpy_js_奇珍异兽"
              ]
              
              # 创建字典以便快速查找
              site_by_key = {site.get('key'): site for site in sites if 'key' in site}
              
              # 按顺序构建新列表
              new_sites = []
              for key in order_keys:
                  if key in site_by_key:
                      new_sites.append(site_by_key[key])
                      del site_by_key[key]
              
              # 剩余的站点按原始顺序追加（保持它们在原始列表中出现的顺序）
              remaining = [site for site in sites if site.get('key') in site_by_key]
              new_sites.extend(remaining)
              
              data['sites'] = new_sites
              return data

          def main():
              if len(sys.argv) != 3:
                  print("用法: python convert_and_reorder.py <输入文件> <输出文件>")
                  sys.exit(1)
              
              input_file = sys.argv[1]
              output_file = sys.argv[2]
              
              with open(input_file, 'r', encoding='utf-8') as f:
                  data = json.load(f)
              
              # 转换路径
              transformed = transform_json(data)
              
              # 重新排序sites
              reordered = reorder_sites(transformed)
              
              # 写入输出文件
              with open(output_file, 'w', encoding='utf-8', newline='\n') as f:
                  json.dump(reordered, f, ensure_ascii=False, indent=2)
              
              print(f"转换和排序完成，输出到 {output_file}")
              print(f"处理了 {len(reordered.get('sites', []))} 个站点")
              print(f"保留了 {len(reordered.get('parses', []))} 个解析接口")
              print(f"保留了 {len(reordered.get('rules', []))} 个规则")
              print(f"保留了 {len(reordered.get('ads', []))} 个广告过滤")

          if __name__ == '__main__':
              main()
          EOF

          python convert_and_reorder.py source_dianshi.json dianshi.json

      - name: Verify the generated file
        run: |
          echo "验证生成的文件..."
          if [ -f dianshi.json ]; then
            echo "文件存在，大小: $(wc -c < dianshi.json) 字节"
            echo "文件前5行:"
            head -5 dianshi.json
          else
            echo "错误: dianshi.json 文件未生成"
            exit 1
          fi

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dianshi.json
          if git diff --cached --quiet; then
            echo "没有更改，跳过提交"
          else
            git commit -m "自动更新 dianshi.json [$(date +'%Y-%m-%d %H:%M:%S')]"
            git push origin main
            echo "已成功推送到 main 分支"
          fi
