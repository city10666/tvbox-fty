name: TVBox 精确同步

on:
  schedule:
    - cron: '0 0 * * *'  # 每天 UTC 时间 00:00 运行（北京时间 08:00）
  workflow_dispatch:     # 允许手动触发
  push:
    branches: [ main ]

jobs:
  sync-dianshi:
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: 设置 Git 配置
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

    - name: 下载源文件
      run: |
        # 下载源仓库的 dianshi.json
        curl -s -o source.json "https://raw.githubusercontent.com/qist/tvbox/master/dianshi.json"

    - name: 精确同步处理
      run: |
        cat > sync.py << 'EOF'
        import json
        import os
        
        # 读取源文件
        with open('source.json', 'r', encoding='utf-8') as f:
            source_data = json.load(f)
        
        # 读取当前文件
        try:
            with open('dianshi.json', 'r', encoding='utf-8') as f:
                current_data = json.load(f)
        except:
            current_data = source_data.copy()
        
        # 定义必须优先的 sites 键值（按照你文档中的精确顺序）
        priority_keys = [
            "drpy_js_优酷",
            "drpy_js_腾云驾雾", 
            "drpy_js_360影视",
            "drpy_js_百忙无果",
            "drpy_js_奇珍异兽",
            "drpy_js_菜狗"
        ]
        
        def sync_sites():
            """同步 sites 数组，保持你的精确顺序"""
            # 从源数据获取所有 sites
            source_sites_dict = {site['key']: site for site in source_data.get('sites', [])}
            
            # 创建新的 sites 列表
            new_sites = []
            
            # 1. 先添加优先级 sites（按照你文档中的精确顺序）
            for key in priority_keys:
                if key in source_sites_dict:
                    new_sites.append(source_sites_dict[key])
            
            # 2. 添加其他 sites（保持源数据中的顺序）
            for site in source_data.get('sites', []):
                if site['key'] not in priority_keys and site['key'] not in [s['key'] for s in new_sites]:
                    new_sites.append(site)
            
            return new_sites
        
        # 构建最终结果 - 完全保持当前文件的结构
        result = current_data.copy()
        
        # 只更新 sites 内容，保持其他所有字段不变
        result['sites'] = sync_sites()
        
        # 写入文件，保持完全相同的格式（2空格缩进）
        with open('dianshi.json', 'w', encoding='utf-8') as f:
            json.dump(result, f, ensure_ascii=False, indent=2)
        
        print("✅ 同步完成，保持了你文档的精确格式和顺序")
        EOF
        
        python3 sync.py

    - name: 检查并提交更改
      run: |
        git add dianshi.json
        if ! git diff --staged --quiet; then
          git commit -m "🔄 自动同步 dianshi.json - $(date +'%Y-%m-%d %H:%M')"
          git push
          echo "✅ 更改已提交"
        else
          echo "📝 无变化，无需提交"
        fi
