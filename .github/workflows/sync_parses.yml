名字: Sync Parses Only

permissions:
  contents: 撰写

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - 名字: Checkout repo
        uses: actions/checkout@v4

      - 名字: Install jq
        run: sudo apt-get install -y jq

      - 名字: Fetch upstream dianshi.json
        run: |
          curl -L -o upstream.json \
          https://raw.githubusercontent.com/qist/tvbox/master/dianshi.json

      - 名字: Merge parses (ultimate stable)
        run: |
          jq \
          --slurpfile up upstream.json \
          '
          .parses =
          (
            [
              {"name":"解析聚合","type":3,"url":"Demo"},
              {"name":"Json并发","type":2,"url":"Parallel"},
              {"name":"Json轮询","type":2,"url":"Sequence"}
            ]
            +
            (
              $up[0].parses
              | map(select(.name? | test("Json聚合"; "i") | not))
              | map(select(.url? and .type?))
              | unique_by(.url)
            )
          )
          ' aiyouteng.json > aiyouteng.new.json

          mv aiyouteng.new.json aiyouteng.json

      - 名字: Commit and push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add aiyouteng.json
          git diff --cached --quiet || git commit -m "auto: sync parses only"
          git push
