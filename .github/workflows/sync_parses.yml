name: Sync Parses Only

permissions:
  contents: write

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Fetch upstream dianshi.json
        run: |
          curl -L -o upstream.json \
          https://raw.githubusercontent.com/qist/tvbox/master/dianshi.json

      - name: Merge parses (ultimate stable)
        run: |
          jq \
--slurpfile up upstream.json \
'
.parses =
(
  $up[0].parses
  | map(
      if .name == "Json聚合" and .type == 3 and .url == "Demo" then
        [
          {"name":"解析聚合","type":3,"url":"Demo"},
          {"name":"Json并发","type":2,"url":"Parallel"},
          {"name":"Json轮询","type":2,"url":"Sequence"}
        ]
      else
        .
      end
    )
  | flatten
)
' aiyouteng.json > aiyouteng.new.json
