name: TVBox Parses Evolution V3 (Platform Aware)

permissions:
  contents: write

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Fetch upstream dianshi.json
        run: |
          curl -L -o upstream.json \
          https://raw.githubusercontent.com/qist/tvbox/master/dianshi.json

      - name: Init stats (platform aware)
        run: |
          [ -f parses_stats.json ] || echo '{}' > parses_stats.json

      - name: Normalize parses + spider (NO STRUCT LOSS)
        run: |
          jq '
            .parses = (
              .parses
              | map(
                  if .name == "Json聚合" and .type == 3 and .url == "Demo" then
                    [
                      {"name":"并发·主力","type":2,"url":"Parallel"},
                      {"name":"轮询·兜底","type":2,"url":"Sequence"},
                      {"name":"聚合·保底","type":3,"url":"Demo"}
                    ]
                  else
                    .
                  end
                )
              | flatten
            )
            | .spider = "https://raw.githubusercontent.com/qist/tvbox/master/jar/fan.txt;md5;3962e9dbce2c7b61a53b1b796f098d47"
          ' upstream.json > base.json

      - name: Platform learning + auto sort
        run: |
          MAX_PARALLEL=6

          jq -c '.parses[]' base.json | while read -r item; do
            url=$(echo "$item" | jq -r '.url')

            [[ "$url" == "Parallel" || "$url" == "Sequence" || "$url" == "Demo" ]] && continue

            key=$(echo -n "$url" | md5sum | cut -d' ' -f1)

            platform="other"
            [[ "$url" =~ iqiyi ]] && platform="iqiyi"
            [[ "$url" =~ qq ]] && platform="qq"
            [[ "$url" =~ youku ]] && platform="youku"
            [[ "$url" =~ mgtv ]] && platform="mgtv"

            ok=$(jq -r ".\"$key\".$platform.ok // 0" parses_stats.json)
            total=$(jq -r ".\"$key\".$platform.total // 0" parses_stats.json)

            if curl -k -L -A "Mozilla/5.0" \
                --range 0-0 \
                --connect-timeout 4 \
                --max-time 6 \
                -s "$url" >/dev/null; then
              hit=1
            else
              hit=0
            fi

            jq ".\"$key\".$platform.ok = ($ok + $hit)
                | .\"$key\".$platform.total = ($total + 1)" \
              parses_stats.json > tmp && mv tmp parses_stats.json
          done

      - name: Final reorder (safe)
        run: |
          jq '
            .parses |= (
              sort_by(
                if .url=="Parallel" or .url=="Sequence" or .url=="Demo" then 9999
                else (.url | length)
                end
              )
            )
          ' base.json > aiyouteng.json

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add aiyouteng.json parses_stats.json
          git diff --cached --quiet || git commit -m "platform-aware parse evolution v3"
          git push
