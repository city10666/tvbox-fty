name: Update dianshi.json

on:
  schedule:
    - cron: '0 0 * * *'  # 每天UTC时间0点运行
  workflow_dispatch:     # 允许手动触发

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch original dianshi.json
        run: |
          curl -o original.json https://raw.githubusercontent.com/qist/tvbox/master/dianshi.json

      - name: Process dianshi.json
        run: |
          # 安装jq工具
          sudo apt-get install -y jq

          # 第一步：处理所有以./开头的路径
          jq 'walk(if type == "object" and has("api") and .api|type == "string" and .api|startswith("./") then 
            .api = "https://github.com/qist/tvbox/blob/master/" + .api[2:]
          elif type == "object" and has("ext") and .ext|type == "string" and .ext|startswith("./") then 
            .ext = "https://github.com/qist/tvbox/blob/master/" + .ext[2:]
          elif type == "object" and has("jar") and .jar|type == "string" and .jar|startswith("./") then 
            .jar = "https://github.com/qist/tvbox/blob/master/" + .jar[2:]
          elif type == "object" and has("playerType") and .playerType|type == "string" and .playerType|startswith("./") then 
            .playerType = "https://github.com/qist/tvbox/blob/master/" + .playerType[2:]
          elif type == "object" and has("searchUrl") and .searchUrl|type == "string" and .searchUrl|startswith("./") then 
            .searchUrl = "https://github.com/qist/tvbox/blob/master/" + .searchUrl[2:]
          else . end)' original.json > processed.json

          # 第二步：严格按要求的顺序排序sites
          jq '{
            other: .other,
            sites: (
              [.sites[] | select(.key == "drpy_js_优酷")] +
              [.sites[] | select(.key == "drpy_js_百忙无果")] +
              [.sites[] | select(.key == "drpy_js_腾云驾雾")] +
              [.sites[] | select(.key == "drpy_js_奇珍异兽")] +
              [.sites[] | select(.key == "drpy_js_菜狗")] +
              [.sites[] | select(.key == "drpy_js_360影视")] +
              [.sites[] | select(.key | IN("drpy_js_优酷", "drpy_js_百忙无果", "drpy_js_腾云驾雾", "drpy_js_奇珍异兽", "drpy_js_菜狗", "drpy_js_360影视") | not)]
            ),
            wallpaper: .wallpaper,
            logo: .logo,
            class: .class,
            beans: .beans,
            lives: .lives,
            rules: .rules,
            ext: .ext,
            drpyJsDz: .drpyJsDz,
            drpyJsBd: .drpyJsBd,
            drpyJsHt: .drpyJsHt,
            drpyJsJf: .drpyJsJf,
            drpyJsLz: .drpyJsLz,
            drpyJsQx: .drpyJsQx,
            drpyJsYc: .drpyJsYc,
            drpyJsWp: .drpyJsWp,
            drpyJsZy: .drpyJsZy,
            drpyJsJisu: .drpyJsJisu,
            drpyJsKuaikan: .drpyJsKuaikan,
            drpyJsMgtv: .drpyJsMgtv,
            drpyJsLetv: .drpyJsLetv,
            drpyJsBesTv: .drpyJsBesTv,
            drpyJsWasu: .drpyJsWasu,
            drpyJsPptv: .drpyJsPptv,
            drpyJsFunTv: .drpyJsFunTv,
            drpyJsFeiyang: .drpyJsFeiyang,
            drpyJsIptv: .drpyJsIptv,
            drpyJsToutiao: .drpyJsToutiao,
            drpyJsWeishi: .drpyJsWeishi,
            drpyJsDouyin: .drpyJsDouyin,
            drpyJsHuoshan: .drpyJsHuoshan,
            drpyJsKuaishou: .drpyJsKuaishou,
            drpyJsXigua: .drpyJsXigua,
            drpyJsSougou: .drpyJsSougou,
            drpyJsBaidu: .drpyJsBaidu,
            drpyJs360: .drpyJs360,
            drpyJsGoogle: .drpyJsGoogle,
            drpyJsBing: .drpyJsBing,
            drpyJsSogou: .drpyJsSogou,
            drpyJsYandex: .drpyJsYandex,
            drpyJsCustom: .drpyJsCustom,
            drpyJsProxy: .drpyJsProxy,
            drpyJsMirror: .drpyJsMirror,
            drpyJsBackup: .drpyJsBackup,
            drpyJsTest: .drpyJsTest,
            drpyJsDev: .drpyJsDev,
            drpyJsBeta: .drpyJsBeta,
            drpyJsAlpha: .drpyJsAlpha,
            drpyJsStable: .drpyJsStable,
            drpyJsLatest: .drpyJsLatest,
            drpyJsLegacy: .drpyJsLegacy,
            drpyJsOld: .drpyJsOld,
            drpyJsNew: .drpyJsNew,
            drpyJsCurrent: .drpyJsCurrent,
            drpyJsDefault: .drpyJsDefault,
            drpyJsFallback: .drpyJsFallback,
            drpyJsPrimary: .drpyJsPrimary,
            drpyJsSecondary: .drpyJsSecondary,
            drpyJsTertiary: .drpyJsTertiary,
            drpyJsQuaternary: .drpyJsQuaternary,
            drpyJsQuinary: .drpyJsQuinary,
            drpyJsSenary: .drpyJsSenary,
            drpyJsSeptenary: .drpyJsSeptenary,
            drpyJsOctonary: .drpyJsOctonary,
            drpyJsNonary: .drpyJsNonary,
            drpyJsDenary: .drpyJsDenary
          }' processed.json > final.json

          # 检查文件是否改变
          if ! cmp -s final.json dianshi.json; then
            cp final.json dianshi.json
            echo "CHANGED=true" >> $GITHUB_ENV
          else
            echo "CHANGED=false" >> $GITHUB_ENV
          fi

      - name: Commit and push changes
        if: env.CHANGED == 'true'
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add dianshi.json
          git commit -m "Auto update dianshi.json"
          git push
