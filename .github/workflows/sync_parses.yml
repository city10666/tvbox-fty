name: Sync Parses and Spider Safely

permissions:
  contents: write

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Fetch upstream dianshi.json
        run: |
          curl -L -o upstream.json \
          https://raw.githubusercontent.com/qist/tvbox/master/dianshi.json

      - name: Merge parses and update spider safely
        run: |
          jq --slurpfile up upstream.json '
            # 更新 parses
            .parses = ($up[0].parses | map(
              if .name == "Json聚合" and .type == 3 and .url == "Demo" then
                [
                  {"name":"解析聚合","type":3,"url":"Demo"},
                  {"name":"Json并发","type":2,"url":"Parallel"},
                  {"name":"Json轮询","type":2,"url":"Sequence"}
                ]
              else
                .
              end
            ) | flatten)
            # 安全更新 spider，如果不存在或不是上游 URL，则替换
            | .spider = (if (.spider | test("^https://raw\\.githubusercontent\\.com/qist/tvbox/master/jar/fan.txt")) then .spider else "https://raw.githubusercontent.com/qist/tvbox/master/jar/fan.txt;md5;3962e9dbce2c7b61a53b1b796f098d47" end)
          ' aiyouteng.json > aiyouteng.new.json
