name: TVBox Parses Evolution V5 Final

permissions:
  contents: write

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  evolve:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Fetch upstream
        run: |
          curl -L -o upstream.json \
          https://raw.githubusercontent.com/qist/tvbox/master/dianshi.json

      - name: Init state
        run: |
          mkdir -p platform
          [ -f parses_stats.json ] || echo '{}' > parses_stats.json
          [ -f aiyouteng.last.json ] || echo '{}' > aiyouteng.last.json

      # ===============================
      # 1. Normalize base (array/object safe)
      # ===============================
      - name: Normalize base
        run: |
          jq 'if type=="array" then {parses: ., spider:"https://raw.githubusercontent.com/qist/tvbox/master/jar/fan.txt;md5;3962e9dbce2c7b61a53b1b796f098d47"} else
              .parses = (
                .parses
                | map(
                    if .name == "Json聚合" and .type == 3 and .url == "Demo" then
                      [
                        {"name":"并发·主力","type":2,"url":"Parallel"},
                        {"name":"轮询·兜底","type":2,"url":"Sequence"},
                        {"name":"聚合·保底","type":3,"url":"Demo"}
                      ]
                    else .
                    end
                  )
                | flatten
              )
              | .spider = "https://raw.githubusercontent.com/qist/tvbox/master/jar/fan.txt;md5;3962e9dbce2c7b61a53b1b796f098d47"
            end' upstream.json > base.json

      # ===============================
      # 2. Platform split + cooldown + success memory
      # ===============================
      - name: Generate platform JSONs
        run: |
          for p in iqiyi qq youku mgtv other; do
            jq --arg p "$p" '
              .parses |= (
                [
                  {"name":"并发·主力","type":2,"url":"Parallel"},
                  {"name":"轮询·兜底","type":2,"url":"Sequence"},
                  {"name":"聚合·保底","type":3,"url":"Demo"}
                ]
                +
                (
                  .parses
                  | map(select(
                      .url!="Parallel" and .url!="Sequence" and .url!="Demo"
                    ))
                  | map(
                      if $p=="iqiyi" then select(.url|test("iqiyi"))
                      elif $p=="qq" then select(.url|test("qq|weiyun"))
                      elif $p=="youku" then select(.url|test("youku"))
                      elif $p=="mgtv" then select(.url|test("mgtv"))
                      else .
                      end
                    )
                )
              )
            ' base.json > platform/$p.new.json

            count=$(jq '.parses | length' platform/$p.new.json)
            if [[ $count -ge 5 ]]; then
              mv platform/$p.new.json platform/$p.json
            else
              echo "⚠️ $p parses too small, skipped"
              rm -f platform/$p.new.json
            fi
          done

      # ===============================
      # 3. Build main aiyouteng.json
      # ===============================
      - name: Build main JSON
        run: |
          cp base.json aiyouteng.json

      # ===============================
      # 4. Commit
      # ===============================
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add aiyouteng.json platform/*.json parses_stats.json
          git diff --cached --quiet || git commit -m "V5 Final platform split JSON"
          git push
