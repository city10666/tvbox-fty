#!/usr/bin/env python3
import json

def reorder_sites(data):
    """重新排序 sites 数组"""
    if 'sites' not in data:
        return data
    sites = data['sites']
    if not isinstance(sites, list):
        return data
    
    # 定义所需的顺序
    order_keys = [
        "drpy_js_优酷",
        "drpy_js_腾云驾雾",
        "drpy_js_百忙无果",
        "drpy_js_奇珍异兽",
        "drpy_js_菜狗"
    ]
    
    # 创建字典以便快速查找
    site_by_key = {site.get('key'): site for site in sites if 'key' in site}
    
    # 按顺序构建新列表
    new_sites = []
    for key in order_keys:
        if key in site_by_key:
            new_sites.append(site_by_key[key])
            del site_by_key[key]
    
    # 剩余的站点按原始顺序追加（保持它们在原始列表中出现的顺序）
    remaining = [site for site in sites if site.get('key') in site_by_key]
    new_sites.extend(remaining)
    
    data['sites'] = new_sites
    return data

# 读取原始文件
with open('tvbox-master/dianshi.json', 'r', encoding='utf-8') as f:
    data = json.load(f)

print("原始 sites 数量:", len(data['sites']))
print("前5个键:", [site.get('key') for site in data['sites'][:5]])
print("后10个键:", [site.get('key') for site in data['sites'][-10:]])

# 重新排序
reordered = reorder_sites(data)

# 检查顺序
ordered_keys = [site.get('key') for site in reordered['sites']]
print("\n重新排序后，前10个键:", ordered_keys[:10])

# 查找目标键的位置
for key in ["drpy_js_优酷", "drpy_js_腾云驾雾", "drpy_js_百忙无果", "drpy_js_奇珍异兽", "drpy_js_菜狗"]:
    try:
        idx = ordered_keys.index(key)
        print(f"{key} 在索引 {idx}")
    except ValueError:
        print(f"{key} 未找到")

# 验证顺序
expected_order = ["drpy_js_优酷", "drpy_js_腾云驾雾", "drpy_js_百忙无果", "drpy_js_奇珍异兽", "drpy_js_菜狗"]
actual = [key for key in ordered_keys if key in expected_order]
if actual == expected_order:
    print("\n✅ 顺序正确")
else:
    print(f"\n❌ 顺序错误: {actual}")
