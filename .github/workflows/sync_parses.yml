name: 🔄 TVBox 配置同步（保持相对路径）

on:
  schedule:
    - cron: '0 8 * * *'  # 每天UTC 8点（北京时间16点）
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  sync-config:
    runs-on: ubuntu-latest
    
    steps:
    - name: 🚀 检出代码
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: ⚙️ 设置 Git 配置
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

    - name: 📥 下载源配置
      run: |
        curl -s -o source.json "https://raw.githubusercontent.com/qist/tvbox/master/dianshi.json"

    - name: 🔄 智能同步处理
      run: |
        cat > sync.py << 'EOF'
        import json
        import os
        
        # 读取源配置
        with open('source.json', 'r', encoding='utf-8') as f:
            source_data = json.load(f)
        
        # 读取当前配置（如果存在）
        current_file = 'dianshi.json'
        if os.path.exists(current_file):
            with open(current_file, 'r', encoding='utf-8') as f:
                current_data = json.load(f)
        else:
            current_data = {}
        
        # 定义必须优先的 sites 键值（按照您的模板顺序）
        priority_keys = [
            "drpy_js_优酷",
            "drpy_js_腾云驾雾", 
            "drpy_js_360影视",
            "drpy_js_百忙无果",
            "drpy_js_奇珍异兽",
            "drpy_js_菜狗"
        ]
        
        def reorder_sites(source_sites):
            """重新排序 sites，保持您的优先顺序"""
            new_sites = []
            source_sites_dict = {site['key']: site for site in source_sites}
            
            # 1. 先添加优先级 sites
            for key in priority_keys:
                if key in source_sites_dict:
                    new_sites.append(source_sites_dict[key])
            
            # 2. 添加其他 sites（保持源顺序）
            for site in source_sites:
                if site['key'] not in priority_keys and site['key'] not in [s['key'] for s in new_sites]:
                    new_sites.append(site)
            
            return new_sites
        
        # 构建最终配置
        result = source_data.copy()  # 使用源数据作为基础
        
        # 只重新排序 sites，保持所有相对路径不变
        result['sites'] = reorder_sites(source_data.get('sites', []))
        
        # 写入文件，保持格式
        with open(current_file, 'w', encoding='utf-8') as f:
            json.dump(result, f, ensure_ascii=False, indent=2)
        
        print(f"✅ 同步完成！共处理 {len(result['sites'])} 个站点")
        EOF
        
        python3 sync.py

    - name: 📊 验证结果
      run: |
        echo "📋 同步结果："
        echo "文件大小: $(wc -c < dianshi.json) 字节"
        echo "站点数量: $(grep -c '"key"' dianshi.json) 个"
        echo "前6个站点:"
        grep -A2 '"key": "drpy_js' dianshi.json | head -12

    - name: 📤 提交更改
      run: |
        git add dianshi.json
        if ! git diff --staged --quiet; then
          git commit -m "🔄 同步TVBox配置 - $(date +'%Y-%m-%d %H:%M')"
          git push
          echo "✅ 更改已提交"
        else
          echo "📝 无变化，无需提交"
        fi
