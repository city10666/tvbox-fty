name: Update dianshi.json

on:
  schedule:
    # 每天 UTC 时间 0 点运行（北京时间 8 点）
    - cron: '0 0 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: city10666/tvbox-fty
          ref: main
          path: target

      - name: Download dianshi.json from source
        run: |
          curl -L -o source_dianshi.json https://raw.githubusercontent.com/qist/tvbox/master/dianshi.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Create conversion script
        run: |
          cat > convert.py << 'EOF'
          #!/usr/bin/env python3
          """
          转换 dianshi.json 中的相对路径为完整 URL（指向原始仓库）。
          """
          import json
          import re
          import sys
          from urllib.parse import urljoin

          BASE_RAW_URL = "https://raw.githubusercontent.com/qist/tvbox/master/"

          def is_url(s: str) -> bool:
              return s.startswith(('http://', 'https://', 'ftp://', '//'))

          def looks_like_file_path(s: str) -> bool:
              if re.match(r'^[a-zA-Z0-9_]+$', s):
                  return False
              if '/' in s and not is_url(s):
                  if s.startswith('csp_'):
                      return False
                  if s.startswith('okhttp/'):
                      return False
                  if s.startswith('Dart/'):
                      return False
                  if s.startswith('Mozilla/'):
                      return False
                  if re.search(r'\.(js|jar|txt|json|md5|png|jpg|ico)$', s):
                      return True
                  if s.startswith('./') or '/' in s:
                      return True
              return False

          def convert_path(path: str) -> str:
              if is_url(path):
                  return path
              if path.startswith('./'):
                  path = path[2:]
              if ';' in path:
                  parts = path.split(';')
                  converted = urljoin(BASE_RAW_URL, parts[0])
                  return ';'.join([converted] + parts[1:])
              else:
                  return urljoin(BASE_RAW_URL, path)

          def convert_string(value: str) -> str:
              if looks_like_file_path(value):
                  return convert_path(value)
              return value

          def transform_json(obj):
              if isinstance(obj, dict):
                  for key, val in obj.items():
                      if key == 'ua':
                          continue
                      obj[key] = transform_json(val)
                  return obj
              elif isinstance(obj, list):
                  return [transform_json(item) for item in obj]
              elif isinstance(obj, str):
                  return convert_string(obj)
              else:
                  return obj

          def main():
              if len(sys.argv) != 3:
                  print("用法: python convert.py <输入文件> <输出文件>")
                  sys.exit(1)
              
              input_file = sys.argv[1]
              output_file = sys.argv[2]
              
              with open(input_file, 'r', encoding='utf-8') as f:
                  data = json.load(f)
              
              transformed = transform_json(data)
              
              with open(output_file, 'w', encoding='utf-8', newline='\n') as f:
                  json.dump(transformed, f, ensure_ascii=False, indent=2)
              
              print(f"转换完成，输出到 {output_file}")

          if __name__ == '__main__':
              main()
          EOF

      - name: Convert dianshi.json
        run: |
          python convert.py source_dianshi.json target/dianshi.json

      - name: Commit and push changes
        run: |
          cd target
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dianshi.json
          if git diff --cached --quiet; then
            echo "没有更改，跳过提交"
          else
            git commit -m "自动更新 dianshi.json [$(date +'%Y-%m-%d %H:%M:%S')]"
            git push origin main
          fi
