name: Update dianshi.json

on:
  schedule:
    - cron: '0 0 * * *'  # 每天UTC时间0点运行
  workflow_dispatch:     # 允许手动触发

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch original dianshi.json
        run: |
          curl -o original.json https://raw.githubusercontent.com/qist/tvbox/master/dianshi.json

      - name: Process dianshi.json
        run: |
          # 安装jq工具
          sudo apt-get install -y jq

          # 处理所有以./开头的路径
          jq 'walk(if type == "object" then 
            with_entries(
              if .value? and (.value|type == "string") and (.value|startswith("./")) then
                .value |= "https://github.com/qist/tvbox/blob/master/" + .[2:]
              else . end
            )
          else . end)' original.json > processed.json

          # 提取并排序指定的sites
          jq '.sites |= (
            map(select(.key | IN("drpy_js_优酷", "drpy_js_百忙无果", "drpy_js_腾云驾雾", "drpy_js_奇珍异兽", "drpy_js_菜狗", "drpy_js_360影视"))) +
            map(select(.key | IN("drpy_js_优酷", "drpy_js_百忙无果", "drpy_js_腾云驾雾", "drpy_js_奇珍异兽", "drpy_js_菜狗", "drpy_js_360影视") | not))
          )' processed.json > final.json

          # 检查文件是否改变
          if ! cmp -s final.json dianshi.json; then
            cp final.json dianshi.json
            echo "CHANGED=true" >> $GITHUB_ENV
          else
            echo "CHANGED=false" >> $GITHUB_ENV
          fi

      - name: Commit and push changes
        if: env.CHANGED == 'true'
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add dianshi.json
          git commit -m "Auto update dianshi.json"
          git push
